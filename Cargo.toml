[package]
name = "rust-os"
version = "0.1.0"
edition = "2021"
authors = ["DakodaStemen"]
description = "A minimal, bootable x86_64 operating system kernel written in Rust"
license = "MIT"
repository = "https://github.com/DakodaStemen/RustOS"
homepage = "https://github.com/DakodaStemen/RustOS"
keywords = ["os", "kernel", "bare-metal", "x86_64", "bootloader"]
categories = ["operating-systems", "embedded", "no-std"]

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.12"
x86_64 = "0.15.5"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = "0.10.5"
pic8259 = "0.10.1"
pc-keyboard = "0.9.0"
crossbeam-queue = { version = "0.3.11", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.30", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"


[package.metadata.bootimage]
# `cargo test` boots each test image in QEMU; isa-debug-exit lets the kernel
# report pass/fail as the QEMU process exit status ((0x10 << 1) | 1 = 33).
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33
test-timeout = 60
