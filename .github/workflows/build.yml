name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            !target/**
            !TROUBLESHOOTING.md
            !docs/ARCHITECTURE.md
            !docs/DEEP_DIVE.md
            !docs/ROADMAP.md
            !research/**

  build:
    name: Lint, build and QEMU test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/bootimage
            ~/.cargo/bin/cargo-bootimage
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install bootimage
        run: command -v bootimage || cargo install bootimage --locked

      - name: Lint (cargo check, clippy)
        run: make lint

      - name: Build bootable image
        run: cargo bootimage --release

      - name: In-kernel tests (cargo test, custom test framework + isa-debug-exit)
        run: cargo test

      - name: Boot in QEMU and run integration test
        run: python3 tests/qemu_test.py
